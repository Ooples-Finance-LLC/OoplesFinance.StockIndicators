name: Pinned StdDev kernel CPU diagnostic

on:
  push:
    branches:
      - perf/hosted-stddev-cpu-profile-20261117

permissions:
  contents: read
  actions: read

concurrency:
  group: pinned-stddev-cpu-profile
  cancel-in-progress: false

jobs:
  profile:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Initialize diagnostic provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PROFILE_OUTPUT=Join-Path $env:RUNNER_TEMP 'stddev-cpu-profile-output'
          $env:INPUT_ARTIFACT=Join-Path $env:RUNNER_TEMP 'stddev-source-artifact'
          $env:PROFILE_RUNTIME=Join-Path $env:RUNNER_TEMP 'stddev-profile-runtime'
          foreach ($name in @('PROFILE_OUTPUT','INPUT_ARTIFACT','PROFILE_RUNTIME')) {
            $value=[Environment]::GetEnvironmentVariable($name)
            "$name=$value" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          }
          if (Test-Path -LiteralPath $env:PROFILE_OUTPUT) { throw 'Fresh diagnostic output required' }
          [IO.Directory]::CreateDirectory($env:PROFILE_OUTPUT) | Out-Null
          [ordered]@{
            diagnostic_only=$true; qualification=$false; production_builds=0; diagnostic_driver_builds=1; tests=0; timed_benchmark_cases=0
            workflow_commit=$env:GITHUB_SHA; workflow_run=$env:GITHUB_RUN_ID
            source_run='44010931924'; source_artifact='candle-predicate-qualification'
            source='6051a95220eefa36e6f837a9a54e036164b76ebe'
            production_sha256='4d571648599e567bb6df0cda1f823d79e95712241078c2ab1721cf7409c10173'
            frozen_benchmark_sha256='48229494a1ff1e4e59bddd5a018cbd590cae24523d52dd2f3effdd20bd802723'
            pair='TaLib.Functions.StdDev';warmups=1000;profile_seconds=10
            merge_on_runner=$false;zip_on_runner=$false;full_managed_rundown=$true
            runner_image=$env:ImageVersion; outer_shell_clr=[Environment]::Version.ToString()
            limits='Diagnostic kernel CPU samples only; not qualified latency, native closure or evidence import. Attribute only resolved stacks within recorded fixture boundaries.'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'workflow-provenance.json') -Encoding utf8
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github/workflows
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - name: Pin kernel CPU collector
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((dotnet --version).Trim() -ne '10.0.403') { throw 'Wrong SDK' }
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]::new($identity)
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Kernel CPU capture requires elevated runner' }
          $tool=Join-Path $env:RUNNER_TEMP 'stddev-PerfView-4.0.0.exe'
          if (Test-Path -LiteralPath $tool) { throw 'Fresh collector path required' }
          Invoke-WebRequest -Uri 'https://github.com/microsoft/perfview/releases/download/v4.0.0/PerfView.exe' -OutFile $tool
          $hash=(Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '270e2ba419b0b2d93c4b15b0851f257edf655c92fe0ad95add3d0b5f6d6aad48') { throw 'Wrong PerfView bytes' }
          [ordered]@{path=$tool;version='4.0.0';sha256=$hash;administrator=$true;collector='Kernel Process,Thread,ImageLoad,Profile';diagnostic_only=$true} |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'tool.json') -Encoding utf8
          $tool | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'tool-path.txt') -Encoding utf8
          dotnet --info | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'dotnet-info.txt') -Encoding utf8
      - uses: actions/download-artifact@v8
        with:
          name: candle-predicate-qualification
          path: ${{ env.INPUT_ARTIFACT }}
          run-id: 44010931924
          github-token: ${{ github.token }}
      - name: Capture one source-bound worker diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $inputs=Join-Path $env:INPUT_ARTIFACT 'predicate-inputs'
          $proof=Join-Path $inputs 'provenance.json'
          $config=Join-Path $inputs 'common/OoplesFinance.StockIndicators.CompetitorBenchmarks.runtimeconfig.json'
          if ((Get-FileHash -LiteralPath $proof -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9013cb468cec2d505c0eb2fb6050517d2a1a5e28b441ade2cd55523be298bf78') { throw 'Wrong input proof' }
          if ((Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c230a317a54dd960bcbeb5f347f52e18dc665a26f7efda2159fced9a5ac7e097') { throw 'Wrong app runtime configuration before launch' }
          Copy-Item -LiteralPath $proof -Destination (Join-Path $env:PROFILE_OUTPUT 'input-provenance.json')
          $dotnet=(Get-Command dotnet).Source
          $driverRoot=Join-Path $env:RUNNER_TEMP 'stddev-diagnostic-driver'
          if (Test-Path -LiteralPath $driverRoot) { throw 'Fresh diagnostic driver directory required' }
          [IO.Directory]::CreateDirectory($driverRoot) | Out-Null
          @('<Project Sdk="Microsoft.NET.Sdk">','<PropertyGroup>','<OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework>',
            '<ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><UseSharedCompilation>false</UseSharedCompilation>',
            '</PropertyGroup>','</Project>') | Set-Content -LiteralPath (Join-Path $driverRoot 'DiagnosticDriver.csproj') -Encoding utf8
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts/profile-darkcloud-pinned-runtime.cs'
          Copy-Item -LiteralPath $script -Destination (Join-Path $driverRoot 'Program.cs')
          dotnet build (Join-Path $driverRoot 'DiagnosticDriver.csproj') -c Release -o (Join-Path $driverRoot 'out') --disable-build-servers --nologo *> (Join-Path $env:PROFILE_OUTPUT 'driver-build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic-only driver build failed' }
          $driver=Join-Path $driverRoot 'out/DiagnosticDriver.dll'
          $manifest=Get-Content -LiteralPath $proof -Raw | ConvertFrom-Json
          if (@($manifest.common_manifest.PSObject.Properties).Count -ne 94) { throw 'Expected 94 common assets' }
          if ((Test-Path -LiteralPath $env:PROFILE_RUNTIME) -or !$env:PROFILE_RUNTIME.StartsWith($env:RUNNER_TEMP+'\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Fresh runtime under job temp required' }
          $common=[IO.Path]::GetFullPath((Join-Path $inputs 'common'))
          $links=@{}
          foreach ($entry in $manifest.common_manifest.PSObject.Properties) {
            $source=[IO.Path]::GetFullPath((Join-Path $common $entry.Name))
            $target=[IO.Path]::GetFullPath((Join-Path $env:PROFILE_RUNTIME $entry.Name))
            if (!$source.StartsWith($common+'\',[StringComparison]::OrdinalIgnoreCase) -or !$target.StartsWith($env:PROFILE_RUNTIME+'\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Escaped runtime member' }
            if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.Value) { throw 'Changed common input' }
            $links[$target]=$source
          }
          $old=Join-Path $inputs 'production/old.dll'
          if ((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4d571648599e567bb6df0cda1f823d79e95712241078c2ab1721cf7409c10173') { throw 'Wrong old production' }
          $links[(Join-Path $env:PROFILE_RUNTIME 'OoplesFinance.StockIndicators.dll')]=$old
          foreach ($entry in $links.GetEnumerator()) {
            [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($entry.Key)) | Out-Null
            $null=New-Item -ItemType HardLink -Path $entry.Key -Target $entry.Value -ErrorAction Stop
          }
          $cim=[ordered]@{processors=@(Get-CimInstance Win32_Processor | ForEach-Object { @{name=$_.Name;cores=$_.NumberOfCores;enabled_cores=$_.NumberOfEnabledCore;logical_processors=$_.NumberOfLogicalProcessors} });computer_logical_processors=(Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors}
          $cim | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'cim.json') -Encoding utf8
          $tool=(Get-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'tool-path.txt') -Raw).Trim()
          $authentication=Join-Path $inputs 'old-candidate-authentication'
          $authManifest=Join-Path $authentication 'manifest.json'
          if ((Get-FileHash -LiteralPath $authManifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f2541e7d0621187f35160c9fcd94627f7fc70169bd185a5a6bc73cae594c1508') { throw 'Wrong old authentication manifest' }
          $auth=Get-Content -LiteralPath $authManifest -Raw | ConvertFrom-Json
          $pdbHash='5c0cbf0fd670fce8a396794a86aaff7043a9d0a9e9fc516eb679e8dd5180c76f'
          if ($auth.source -ne 'a1f0028c601e1c6e7be5eabfe0d5da5cfe1f0758' -or $auth.runtime_files.'src/bin/Release/net10.0/OoplesFinance.StockIndicators.dll' -ne '4d571648599e567bb6df0cda1f823d79e95712241078c2ab1721cf7409c10173' -or $auth.runtime_files.'src/bin/Release/net10.0/OoplesFinance.StockIndicators.pdb' -ne $pdbHash) { throw 'Wrong production/PDB authentication binding' }
          $pdbSource=Join-Path $authentication ('blobs/'+$pdbHash)
          if ((Get-FileHash -LiteralPath $pdbSource -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pdbHash) { throw 'Wrong production PDB bytes' }
          $symbols=Join-Path $env:PROFILE_OUTPUT 'symbols'
          [IO.Directory]::CreateDirectory($symbols) | Out-Null
          Copy-Item -LiteralPath $pdbSource -Destination (Join-Path $symbols 'OoplesFinance.StockIndicators.pdb')
          Copy-Item -LiteralPath $authManifest -Destination (Join-Path $symbols 'authentication-manifest.json')
          $env:_NT_SYMBOL_PATH=$symbols
          [ordered]@{separate_symbol_root=$symbols;symbol_path=$env:_NT_SYMBOL_PATH;pdb_sha256=$pdbHash;manifest_sha256='f2541e7d0621187f35160c9fcd94627f7fc70169bd185a5a6bc73cae594c1508';protected_runtime_pdb_replaced=$false;source_pdb_binding='Authenticated old production DLL4d and PDB5c from compiled a1f manifest; frozen runtime PDB untouched';diagnostic_only=$true} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'symbols.json') -Encoding utf8
          function IdleGate($name) {
            $samples=[Collections.Generic.List[double]]::new()
            for ($i=0;$i -lt 12;$i++) {
              $samples.Add((Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 1 -MaxSamples 1).CounterSamples[0].CookedValue)
            }
            $busy=@(Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^(dotnet|MSBuild|testhost|VBCSCompiler)(\.exe)?$' -and $_.CommandLine -match '(?i)(\s(build|test|vstest)\s|MSBuild\.(exe|dll)|testhost|VBCSCompiler)' } | Select-Object ProcessId,Name,CommandLine)
            $passed=$samples.Count -eq 12 -and @($samples | Where-Object { ![double]::IsFinite($_) -or $_ -lt 0 -or $_ -ge 15 }).Count -eq 0 -and $busy.Count -eq 0
            [ordered]@{cpu_percent=$samples.ToArray();build_test_processes=$busy;passed=$passed;utc=[DateTime]::UtcNow.ToString('O')} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT ($name+'.json')) -Encoding utf8
            return $passed
          }
          # Fixed preparation only: these probes never replace mandatory gate samples.
          $initializationProbes=(Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 1 -MaxSamples 2).CounterSamples.CookedValue
          [ordered]@{cpu_percent=@($initializationProbes);preparation_only=$true;mandatory_gate_samples=12;settle_seconds=5;utc=[DateTime]::UtcNow.ToString('O')} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'cpu-probe-preparation.json') -Encoding utf8
          Start-Sleep -Seconds 5
          $prePassed=IdleGate 'idle-before'
          if (!$prePassed) { throw 'Pre-capture idle gate failed; no capture' }
          $trace=Join-Path $env:PROFILE_OUTPUT 'cpu.etl'
          $collectionLog=Join-Path $env:PROFILE_OUTPUT 'cpu.log'
          $replay=Join-Path $env:PROFILE_OUTPUT 'replay'
          $arguments=@('/AcceptEula','/NoGui','/NoView','/KernelEvents:Process,Thread,ImageLoad,Profile',
            '/ClrEvents:Jit,Loader,JittedMethodILToNativeMap','/FocusProcess:dotnet.exe',
            '/BufferSizeMB:16','/CircularMB:32','/MaxCollectSec:40','/Merge:false','/Zip:false',('/DataFile:'+$trace),('/LogFile:'+$collectionLog),
            'run',$dotnet,'exec','--runtimeconfig',$config,$driver,$inputs,$env:PROFILE_RUNTIME,$replay)
          $launch=[ordered]@{command=$tool;arguments=$arguments;diagnostic_driver_sha256=(Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToLowerInvariant();diagnostic_driver_builds=1;production_builds=0;tests=0;timed_benchmark_cases=0;runtimeconfig_sha256=(Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash.ToLowerInvariant();script_sha256=(Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash.ToLowerInvariant();child_timeout_seconds=60;output_cap_bytes=104857600;runtime_payload_copy_bytes=0;diagnostic_only=$true;qualification=$false}
          $launch | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'capture-launch.json') -Encoding utf8
          $startInfo=[Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName=$tool; $startInfo.UseShellExecute=$false; $startInfo.CreateNoWindow=$true
          $startInfo.RedirectStandardOutput=$true; $startInfo.RedirectStandardError=$true
          foreach ($argument in $arguments) { $startInfo.ArgumentList.Add([string]$argument) }
          $process=[Diagnostics.Process]::new();$process.StartInfo=$startInfo
          $clock=[Diagnostics.Stopwatch]::StartNew();$failure=$null;$started=$false;$capturePassed=$false;$postPassed=$false;$validationFailure=$null
          try {
            if (!$process.Start()) { throw 'Cannot start existing diagnostic tool' }
            $started=$true
            $stdout=$process.StandardOutput.ReadToEndAsync();$stderr=$process.StandardError.ReadToEndAsync()
            while (!$process.WaitForExit(250)) {
              $bytes=(Get-ChildItem -LiteralPath $env:PROFILE_OUTPUT -Recurse -File | Measure-Object Length -Sum).Sum
              if ($clock.Elapsed.TotalSeconds -gt 60) { $failure='60 second child watchdog'; break }
              if ($bytes -gt 104857600) { $failure='100MiB output cap'; break }
            }
            if ($failure) { $process.Kill($true);$process.WaitForExit() }
            $stdout.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'capture.log') -Encoding utf8
            $stderr.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'capture-error.log') -Encoding utf8
            $bytes=(Get-ChildItem -LiteralPath $env:PROFILE_OUTPUT -Recurse -File | Measure-Object Length -Sum).Sum
            if ($bytes -gt 104857600) { $failure='100MiB output cap after exit' }
            [ordered]@{exit_code=$process.ExitCode;elapsed_seconds=$clock.Elapsed.TotalSeconds;limit_failure=$failure;output_bytes=$bytes;diagnostic_only=$true;qualification=$false} |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'capture.json') -Encoding utf8
            if ($failure -or $process.ExitCode -ne 0) { throw 'Capture failed; preserve all existing output' }
            foreach ($rawName in @('cpu.etl','cpu.kernel.etl','cpu.clrRundown.etl')) {
              $rawPath=Join-Path $env:PROFILE_OUTPUT $rawName
              if (!(Test-Path -LiteralPath $rawPath -PathType Leaf) -or (Get-Item -LiteralPath $rawPath).Length -le 0) { throw 'Required raw ETL missing or empty' }
            }
            if (Test-Path -LiteralPath ($trace+'.zip')) { throw 'Unexpected runner ZIP; raw-only capture required' }
            $collectorText=Get-Content -LiteralPath $collectionLog -Raw
            if ($collectorText -notmatch ' SUCCESS:' -or $collectorText -match '\[Error:' -or $collectorText -match '\[Merging data files') { throw 'Collector did not report clean raw-only success' }
            if ((Get-FileHash -LiteralPath (Join-Path $symbols 'OoplesFinance.StockIndicators.pdb') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pdbHash) { throw 'Symbol bytes changed' }
            $receipt=Get-Content -LiteralPath (Join-Path $replay 'replay.json') -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'complete' -or $receipt.pair -ne 'TaLib.Functions.StdDev' -or $receipt.warmups -ne 1000 -or $receipt.profile_seconds -ne 10 -or $receipt.host_clr -ne '10.0.15' -or !$receipt.protected_inputs_unchanged -or !$receipt.runtime_unchanged) { throw 'Replay incomplete, mismatched or runtime changed' }
            $capturePassed=$true
          } catch {
            $validationFailure=$_.Exception.ToString()
            throw
          } finally {
            if ($started -and !$process.HasExited) { $process.Kill($true);$process.WaitForExit() }
            $process.Dispose()
            if ($started) {
              try { $postPassed=IdleGate 'idle-after' }
              catch { $validationFailure=([string]$validationFailure)+' Post-gate error: '+$_.Exception.ToString() }
            }
            $finalBytes=(Get-ChildItem -LiteralPath $env:PROFILE_OUTPUT -Recurse -File | Measure-Object Length -Sum).Sum
            if ($finalBytes -gt 104857600) { $capturePassed=$false;$validationFailure=([string]$validationFailure)+' 100MiB final output cap' }
            $valid=$capturePassed -and $prePassed -and $postPassed -and $null -eq $validationFailure
            $profileValidation=[ordered]@{profile_valid_for_diagnostic_only=$valid;pre_idle_passed=$prePassed;post_idle_passed=$postPassed;raw_capture_complete=$capturePassed;failure=$validationFailure;output_bytes=$finalBytes;qualification=$false;native_win_claim=$false;source_imported=$false;report_imported=$false}
            $profileValidation | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'profile-validation.json') -Encoding utf8
            Get-ChildItem -LiteralPath $env:PROFILE_OUTPUT -Recurse -File | ForEach-Object {
              [ordered]@{path=$_.FullName.Substring($env:PROFILE_OUTPUT.Length);bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'output-manifest.json') -Encoding utf8
            $sealedBytes=(Get-ChildItem -LiteralPath $env:PROFILE_OUTPUT -Recurse -File | Measure-Object Length -Sum).Sum
            if ($sealedBytes -gt 104857600) {
              $valid=$false;$profileValidation.profile_valid_for_diagnostic_only=$false;$profileValidation.output_bytes=$sealedBytes
              $profileValidation.failure=([string]$profileValidation.failure)+' 100MiB output cap including final metadata'
              $profileValidation | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'profile-validation.json') -Encoding utf8
              Get-ChildItem -LiteralPath $env:PROFILE_OUTPUT -Recurse -File | Where-Object { $_.FullName -ne (Join-Path $env:PROFILE_OUTPUT 'output-manifest.json') } | ForEach-Object {
                [ordered]@{path=$_.FullName.Substring($env:PROFILE_OUTPUT.Length);bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
              } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:PROFILE_OUTPUT 'output-manifest.json') -Encoding utf8
            }
            if (!$valid) { throw 'Capture invalid, incomplete or idle gate failed; preserve all evidence' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stddev-cpu-profile
          path: ${{ env.PROFILE_OUTPUT }}/
          retention-days: 14
          if-no-files-found: error
