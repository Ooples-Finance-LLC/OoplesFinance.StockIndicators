name: Seven-candle word and dispatch qualification
on:
  workflow_dispatch:
  push:
    branches: [perf/seven-candle-word-qualification-20261118]
permissions:
  contents: read
  actions: read
concurrency:
  group: seven-candle-word-qualification
  cancel-in-progress: false
env:
  HOSTED_TIMING_PLAN: benchmarks/plans/hosted-seven-candle-word-qualification-20261118.json
jobs:
  qualify:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            .github
            benchmarks/plans
      - name: Fail closed before SDK or input setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $plan=Get-Content -LiteralPath $env:HOSTED_TIMING_PLAN -Raw | ConvertFrom-Json
          if ($plan.inputs_ready -isnot [bool] -or !$plan.inputs_ready -or $plan.sources.successor -ne 'd1933adf1c979bc19a5fab3f2bb2b26946386386' -or $plan.sources.old -ne '9e914007c3438d9f251f3fab9ef321d49c22de83') { throw 'UNBOUND seven-candle readiness; no SDK or input I/O permitted' }
          if ((Get-FileHash -LiteralPath $plan.scope_approval.path).Hash.ToLowerInvariant() -ne $plan.scope_approval.sha256) { throw 'Approval binding mismatch' }
          $approved=Get-Content -LiteralPath $plan.scope_approval.path -Raw | ConvertFrom-Json
          if ($approved.approved -isnot [bool] -or !$approved.approved -or $approved.scope -ne 'seven-candle-word-qualification-20261118' -or $approved.cases -ne 198 -or $approved.decisions -ne 42) { throw 'UNBOUND parent approval' }
          foreach ($role in @('old_candidate','candidate')) {
            $receipt=$plan.$role
            foreach ($key in @('manifest_sha256','gpu_receipt_sha256','production_sha256','source_fingerprint','artifact_zip_sha256','actual_harness_sha256')) { if ($receipt.$key -notmatch '^[a-f0-9]{64}$') { throw 'UNBOUND actual CPU/GPU receipt hashes' } }
            foreach ($key in @('producer','evidence_source')) { if ($receipt.$key -notmatch '^[a-f0-9]{40}$') { throw 'UNBOUND actual receipt commits' } }
            foreach ($key in @('ci_run','artifact_id','unit_passed','parity_passed')) { if ([string]$receipt.$key -notmatch '^[1-9][0-9]*$') { throw 'UNBOUND actual receipt run/counts' } }
          }
          if ($plan.harness_sha256 -notmatch '^[a-f0-9]{64}$') { throw 'UNBOUND actual baseline harness' }
          if ($plan.targeted_reference.archive_source -notmatch '^[a-f0-9]{40}$' -or $plan.targeted_reference.sha256 -notmatch '^[a-f0-9]{64}$') { throw 'UNBOUND current master qualification reference' }
          if ($plan.parent_review_approved -isnot [bool] -or !$plan.parent_review_approved) { throw 'UNBOUND parent review' }
          if ((Get-FileHash -LiteralPath $plan.roi_approval.path).Hash.ToLowerInvariant() -ne $plan.roi_approval.sha256) { throw 'ROI approval binding mismatch' }
          $roi=Get-Content -LiteralPath $plan.roi_approval.path -Raw | ConvertFrom-Json
          if ($roi.approved -isnot [bool] -or !$roi.approved -or $roi.root_authenticated -isnot [bool] -or !$roi.root_authenticated -or $roi.summary.sha256 -notmatch '^[a-f0-9]{64}$' -or $roi.run_id -notmatch '^[1-9][0-9]*$' -or $roi.workflow_head -notmatch '^[a-f0-9]{40}$') { throw 'UNBOUND root-authenticated ROI promotion' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - name: Validate actual source and registry boundary before input downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Push-Location scripts
          try {
            python -m unittest -v test_hosted_seven_candle_qualification
            if ($LASTEXITCODE -ne 0) { throw 'Seven-candle orchestration tests failed' }
            python -c "from hosted_timing import seven_candle_qualification as q; from hosted_timing.targeted import verify_reference; plan=q.p.read(q.p.PLAN); q.validate_scope(plan); verify_reference(plan)"
            if ($LASTEXITCODE -ne 0) { throw 'Seven-candle evidence is not executable' }
          } finally { Pop-Location }
          $plan=Get-Content -LiteralPath $env:HOSTED_TIMING_PLAN -Raw | ConvertFrom-Json
          foreach ($role in @('old_candidate','candidate')) {
            $receipt=$plan.$role
            $artifact=Invoke-RestMethod -Uri ('https://api.github.com/repos/Ooples-Finance-LLC/OoplesFinance.StockIndicators/actions/artifacts/'+$receipt.artifact_id) -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);'X-GitHub-Api-Version'='2022-11-28'}
            if ($artifact.id -ne [long]$receipt.artifact_id -or $artifact.name -ne 'candidate-correctness-inputs' -or $artifact.expired -or $artifact.workflow_run.id -ne [long]$receipt.ci_run -or $artifact.workflow_run.head_sha -ne $receipt.producer -or $artifact.digest -ne ('sha256:'+$receipt.artifact_zip_sha256)) { throw 'Actual artifact API identity/digest mismatch' }
            ($role.ToUpperInvariant()+'_RUN='+$receipt.ci_run) | Add-Content -LiteralPath $env:GITHUB_ENV
            ($role.ToUpperInvariant()+'_ID='+$receipt.artifact_id) | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.OLD_CANDIDATE_ID }}
          merge-multiple: true
          path: old-candidate
          run-id: ${{ env.OLD_CANDIDATE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.CANDIDATE_ID }}
          merge-multiple: true
          path: candidate
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
      - name: Authenticate existing builds and baseline harness role alias
        run: python scripts/prepare-seven-candle-word-qualification.py --old-candidate old-candidate --candidate candidate --out seven-candle-inputs
      - name: Measure all 198 cases under unchanged policy
        run: python scripts/run-hosted-timing.py measure --inputs seven-candle-inputs --out seven-candle-qualification/evidence/shard0 --phase targeted --shard 0
      - name: Verify all 42 source decisions and both required native closures
        run: python scripts/run-hosted-timing.py collect --inputs seven-candle-qualification/evidence --prepared seven-candle-inputs --out seven-candle-qualification/summary.json --phase targeted
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seven-candle-word-qualification
          path: |
            seven-candle-inputs/
            seven-candle-qualification/
          if-no-files-found: warn
