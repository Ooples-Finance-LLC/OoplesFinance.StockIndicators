name: GapSide original-state replay ten-case full-call ROI
on:
  push:
    branches: [perf/gapside-interval-replay-roi-20261119]
    paths: [.github/workflows/gapside-interval-replay-roi.yml]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: gapside-interval-replay-roi
  cancel-in-progress: false
env:
  HOSTED_TIMING_PLAN: benchmarks/plans/hosted-gapside-interval-replay-roi-20261119.json
jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            .github
            benchmarks/plans
      - name: Fail closed before SDK or input setup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $plan=Get-Content -LiteralPath $env:HOSTED_TIMING_PLAN -Raw | ConvertFrom-Json
          if ($plan.inputs_ready -isnot [bool] -or !$plan.inputs_ready -or $plan.parent_review_approved -isnot [bool] -or !$plan.parent_review_approved) { throw 'HELD before SDK or input setup; root final plan review required' }
          if ($plan.diagnostic_kind -ne 'gapside-interval-replay-native-pilot' -or $plan.diagnostic_only -ne $true -or $plan.cases -ne 10 -or $plan.decisions -ne 2 -or $plan.matrix.max_parallel -ne 1 -or $plan.sources.old -ne '4b4e8a385ed1c210998d26de6460e23f5842ffe9' -or $plan.sources.successor -ne '9025295cc3901fed088ed45f09c53ab4edd46988' -or $plan.closure_ledger_new_rows -ne 0) { throw 'Wrong bounded diagnostic scope' }
          if ($env:GITHUB_REF_NAME -ne 'perf/gapside-interval-replay-roi-20261119' -or $plan.preparation_branch -ne $env:GITHUB_REF_NAME -or $plan.preparation_revision -ne 'gapside-interval-replay-roi-v1-20261119' -or $plan.input_pin_status -ne 'bound') { throw 'Wrong or incomplete GapSide preparation binding' }
          $actualRef=@(& git ls-remote origin refs/heads/perf/remaining-indicator-rollout)
          if ($LASTEXITCODE -ne 0 -or $actualRef.Count -ne 1 -or ($actualRef[0] -split '\s+')[0] -ne '20d21f263a25f14c4c15a0ab9354bfc91e0dab60') { throw 'Published baseline changed; no SDK/input I/O permitted' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - name: Select the installed diagnostic SDK before input downloads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # This runner-only selector is not committed source or a build input.
          if (Test-Path -LiteralPath global.json) { throw 'Unexpected existing SDK selector' }
          [IO.File]::WriteAllText((Join-Path $PWD 'global.json'), '{"sdk":{"version":"10.0.403","rollForward":"disable","allowPrerelease":false}}')
          $actualSdk=(& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSdk -ne '10.0.403') { throw ('Wrong actual diagnostic SDK: '+$actualSdk) }
          $actualInfo=(& dotnet --info | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect dotnet installation' }
          # The muxer can be newer than the CLR selected for these net10 inputs.
          $installedRuntimes=@(& dotnet --list-runtimes)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect installed runtimes' }
          $compatibleRuntimes=@($installedRuntimes | ForEach-Object {
            if ($_ -match '^Microsoft\.NETCore\.App (10\.0\.\d+) \[') { [version]$Matches[1] }
          } | Sort-Object)
          if ($compatibleRuntimes.Count -eq 0 -or $compatibleRuntimes[-1].ToString() -ne '10.0.15') { throw ('Wrong installed net10 compatible runtime: '+($installedRuntimes -join '; ')) }
          Write-Output ('Installed net10 compatible runtime: '+$compatibleRuntimes[-1])
          Write-Output $actualInfo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - name: Validate actual source and registry boundary before input downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          Push-Location scripts
          try {
            python -m unittest -v test_hosted_gapside_interval_replay_roi
            if ($LASTEXITCODE -ne 0) { throw 'Reconciliation orchestration tests failed' }
            python -c "from hosted_timing import gapside_interval_replay_roi as q; q.validate_scope(q.p.read(q.p.PLAN)); q.verify_current_publication(q.p.read(q.p.PLAN))"
            if ($LASTEXITCODE -ne 0) { throw 'Reconciliation evidence is not executable' }
          } finally { Pop-Location }
          $plan=Get-Content -LiteralPath $env:HOSTED_TIMING_PLAN -Raw | ConvertFrom-Json
          foreach ($role in @('old_candidate','candidate')) {
            $receipt=$plan.$role
            $artifact=Invoke-RestMethod -Uri ('https://api.github.com/repos/Ooples-Finance-LLC/OoplesFinance.StockIndicators/actions/artifacts/'+$receipt.artifact_id) -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);'X-GitHub-Api-Version'='2022-11-28'}
            if ($artifact.id -ne [long]$receipt.artifact_id -or $artifact.name -ne 'candidate-correctness-inputs' -or $artifact.expired -or $artifact.workflow_run.id -ne [long]$receipt.ci_run -or $artifact.workflow_run.head_sha -ne $receipt.producer -or $artifact.digest -ne ('sha256:'+$receipt.artifact_zip_sha256)) { throw 'Actual artifact API identity/digest mismatch' }
            ($role.ToUpperInvariant()+'_RUN='+$receipt.ci_run) | Add-Content -LiteralPath $env:GITHUB_ENV
            ($role.ToUpperInvariant()+'_ID='+$receipt.artifact_id) | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.OLD_CANDIDATE_ID }}
          merge-multiple: true
          path: old-candidate
          run-id: ${{ env.OLD_CANDIDATE_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.CANDIDATE_ID }}
          merge-multiple: true
          path: candidate
          run-id: ${{ env.CANDIDATE_RUN }}
          github-token: ${{ github.token }}
      - name: Authenticate two existing builds and explicit baseline native harness role alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare-gapside-interval-replay-roi.py --old-candidate old-candidate --candidate candidate --out reconciled-inputs
      - uses: actions/upload-artifact@v7
        with:
          name: gapside-interval-replay-roi-inputs
          path: reconciled-inputs/
          if-no-files-found: error
  measure:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            .github
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - name: Select the installed diagnostic SDK before input downloads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # This runner-only selector is not committed source or a build input.
          if (Test-Path -LiteralPath global.json) { throw 'Unexpected existing SDK selector' }
          [IO.File]::WriteAllText((Join-Path $PWD 'global.json'), '{"sdk":{"version":"10.0.403","rollForward":"disable","allowPrerelease":false}}')
          $actualSdk=(& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSdk -ne '10.0.403') { throw ('Wrong actual diagnostic SDK: '+$actualSdk) }
          $actualInfo=(& dotnet --info | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect dotnet installation' }
          # The muxer can be newer than the CLR selected for these net10 inputs.
          $installedRuntimes=@(& dotnet --list-runtimes)
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect installed runtimes' }
          $compatibleRuntimes=@($installedRuntimes | ForEach-Object {
            if ($_ -match '^Microsoft\.NETCore\.App (10\.0\.\d+) \[') { [version]$Matches[1] }
          } | Sort-Object)
          if ($compatibleRuntimes.Count -eq 0 -or $compatibleRuntimes[-1].ToString() -ne '10.0.15') { throw ('Wrong installed net10 compatible runtime: '+($installedRuntimes -join '; ')) }
          Write-Output ('Installed net10 compatible runtime: '+$compatibleRuntimes[-1])
          Write-Output $actualInfo
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: gapside-interval-replay-roi-inputs
          path: reconciled-inputs
      - name: Measure one frozen shard under unchanged policy
        run: python scripts/run-hosted-timing.py measure --inputs reconciled-inputs --out reconciled-qualification/evidence/shard${{ matrix.shard }} --phase diagnostic --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gapside-interval-replay-roi-raw-${{ matrix.shard }}
          path: reconciled-qualification/evidence/
          if-no-files-found: warn
  collect:
    needs: measure
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            .github
            benchmarks/plans
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: gapside-interval-replay-roi-inputs
          path: reconciled-inputs
      - uses: actions/download-artifact@v8
        with:
          pattern: gapside-interval-replay-roi-raw-*
          merge-multiple: true
          path: reconciled-qualification/evidence
      - name: Verify two source comparisons and primary native crossover diagnostics
        run: python scripts/run-hosted-timing.py collect --inputs reconciled-qualification/evidence --prepared reconciled-inputs --out reconciled-qualification/summary.json --phase diagnostic
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gapside-interval-replay-roi
          path: |
            reconciled-inputs/
            reconciled-qualification/
          if-no-files-found: warn
