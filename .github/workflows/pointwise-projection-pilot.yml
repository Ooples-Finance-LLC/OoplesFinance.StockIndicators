name: Pointwise projection native pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pointwise-projection-native-pilot
  cancel-in-progress: false
env:
  HOSTED_TIMING_PLAN: benchmarks/plans/hosted-pointwise-projection-native-pilot-20261116.json
jobs:
  native-pilot:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            .github
            benchmarks/plans
      - uses: actions/checkout@v7
        with:
          ref: 4765572c25cae6b4758e3f133a22ae84aaa7710e
          path: harness-source
          fetch-depth: 1
          sparse-checkout: |
            src
            benchmarks/OoplesFinance.StockIndicators.CompetitorBenchmarks
            benchmarks/OoplesFinance.StockIndicators.CompetitorTests
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - name: Verify bounded orchestration
        run: |
          Push-Location scripts
          python -m unittest -v test_hosted_pointwise_projection_roi test_hosted_candle_six_roi test_hosted_candle_integer_roi test_hosted_candle_family_roi test_hosted_adosc_followup_roi test_hosted_timing test_hosted_fixture_inventory test_hosted_runtime_dependencies test_hosted_window_log_positive_regions_20261115
          $testExit = $LASTEXITCODE
          Pop-Location
          if ($testExit -ne 0) { exit $testExit }
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: baseline-inputs
          run-id: 43673961720
          github-token: ${{ github.token }}
      - name: Build only harness, verify outputs and authenticate unchanged production/GPU evidence
        run: python scripts/run-pointwise-projection-roi.py prepare --baseline baseline-inputs --source harness-source --out projection-inputs
      - name: Measure thirty approved diagnostic cases
        run: python scripts/run-pointwise-projection-roi.py measure --inputs projection-inputs --out projection-diagnostic/evidence/shard0
      - name: Independently check complete diagnostic
        run: python scripts/run-pointwise-projection-roi.py verify --inputs projection-diagnostic/evidence --out projection-diagnostic/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pointwise-projection-roi-diagnostic
          path: |
            projection-inputs/
            projection-diagnostic/
          retention-days: 14
          if-no-files-found: error
