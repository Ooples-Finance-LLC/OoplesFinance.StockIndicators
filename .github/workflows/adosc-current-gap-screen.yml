name: Pinned Stoch fixed-grid candidate kernel CPU profile

on:
  push:
    branches:
      - perf/hosted-stoch-grid-cpu-profile-20261117

permissions:
  contents: read
  actions: read

concurrency:
  group: pinned-stoch-grid-cpu-profile
  cancel-in-progress: false

env:
  EXPECTED_NEW_CORE_SHA: 7bbfb63d3794034d88047d11d40682938d8076ff58aa64d53a0ba2096089317b
  EXPECTED_MANIFEST_SHA: c0be31608e8df96ad275e31604b6916e7d027e782eb1bcd8a48659d77a658c2d
  EXPECTED_SOURCE_FINGERPRINT: 7075fdf54f314f89e9b08e423b444e9850456525cb0f636d5ebbe410c12f0d81
  EXPECTED_GPU_RECEIPT_SHA: 71112bcbc23d5ca4190edbc6735f0bddb0f9d3f79f7f34dbbce92f0eec3b29b7
  EXPECTED_GPU_TRX_GZ_SHA: 9358f2957b525771e9bdf6f650444422c4a787741debc696a9ba5ff97aa88fd5
  EXPECTED_CANDIDATE_ARTIFACT_ID: '14352708612'
  EXPECTED_CANDIDATE_ZIP_SHA: d6f67dcb83a94e3252ca0e41fe488915d417575592887578622c9a28e27895ee
  GPU_RECEIPT_COMMIT: f1f875f6c7b54478fbd7a6d634231f6715d3fcf2

jobs:
  screen:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Initialize fresh diagnostic paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($pin in @($env:EXPECTED_NEW_CORE_SHA,$env:EXPECTED_MANIFEST_SHA,$env:EXPECTED_SOURCE_FINGERPRINT,$env:EXPECTED_GPU_RECEIPT_SHA,$env:EXPECTED_GPU_TRX_GZ_SHA,$env:EXPECTED_CANDIDATE_ZIP_SHA)) {
            if ($pin -notmatch '^[0-9a-f]{64}$') { throw 'UNBOUND candidate/GPU pins; no diagnostic input/output I/O permitted' }
          }
          if ($env:GPU_RECEIPT_COMMIT -notmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_CANDIDATE_ARTIFACT_ID -notmatch '^\d+$') { throw 'UNBOUND GPU-only commit or candidate artifact ID' }
          foreach ($name in @('SCREEN_ROOT','OLD_INPUT','NEW_INPUT','GPU_INPUT')) {
            $value=if ($name -eq 'GPU_INPUT') { Join-Path $env:GITHUB_WORKSPACE 'gpu-proof/benchmarks/results/shared-rollout/local-gpu-contracts' } else { Join-Path $env:RUNNER_TEMP ('stoch-grid-roi-'+$name.ToLowerInvariant()) }
            if (Test-Path -LiteralPath $value) { throw 'Fresh job paths required' }
            [Environment]::SetEnvironmentVariable($name,$value)
            "$name=$value" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          }
          [IO.Directory]::CreateDirectory($env:SCREEN_ROOT) | Out-Null
          [ordered]@{workflow_head=$env:GITHUB_SHA;run_id=$env:GITHUB_RUN_ID;diagnostic_only=$true;qualification=$false;native_win_claim=$false;production_builds=0;tests=0;timed_benchmark_cases=0;profile_seconds=10;helper_compiler_sdk='10.0.403';driver_builds=1;individual_process_cap_seconds=60;runner_image=$env:ImageVersion} | ConvertTo-Json | Set-Content (Join-Path $env:SCREEN_ROOT 'provenance.json') -Encoding utf8
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github/workflows
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/download-artifact@v8
        with:
          name: candle-predicate-qualification
          path: ${{ env.OLD_INPUT }}
          run-id: 44010931924
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.EXPECTED_CANDIDATE_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ env.NEW_INPUT }}
          run-id: 44136637430
          github-token: ${{ github.token }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.GPU_RECEIPT_COMMIT }}
          path: gpu-proof
          sparse-checkout: benchmarks/results/shared-rollout/local-gpu-contracts
          persist-credentials: false
      - name: Authenticate binaries and build only diagnostic helper
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if ((dotnet --version).Trim() -ne '10.0.403') { throw 'Wrong SDK' }
          $artifact=Invoke-RestMethod -Uri ('https://api.github.com/repos/Ooples-Finance-LLC/OoplesFinance.StockIndicators/actions/artifacts/'+$env:EXPECTED_CANDIDATE_ARTIFACT_ID) -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);'X-GitHub-Api-Version'='2022-11-28'}
          if ($artifact.digest -ne ('sha256:'+$env:EXPECTED_CANDIDATE_ZIP_SHA) -or $artifact.id -ne [long]$env:EXPECTED_CANDIDATE_ARTIFACT_ID -or $artifact.name -ne 'candidate-correctness-inputs' -or $artifact.expired -or $artifact.workflow_run.id -ne 44136637430 -or $artifact.workflow_run.head_sha -ne '2a1737f30e5e1164189d0209b39ea46bf38c1239') { throw 'Wrong candidate artifact metadata' }
          $artifact | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:SCREEN_ROOT 'candidate-artifact.json') -Encoding utf8
          $inputs=Join-Path $env:OLD_INPUT 'predicate-inputs'
          $proof=Join-Path $inputs 'provenance.json'
          if ((Get-FileHash $proof).Hash.ToLowerInvariant() -ne '9013cb468cec2d505c0eb2fb6050517d2a1a5e28b441ade2cd55523be298bf78') { throw 'Wrong frozen input proof' }
          $newManifest=Join-Path $env:NEW_INPUT 'manifest.json'
          if ((Get-FileHash $newManifest).Hash.ToLowerInvariant() -ne $env:EXPECTED_MANIFEST_SHA) { throw 'Wrong candidate manifest' }
          $manifest=Get-Content $proof -Raw | ConvertFrom-Json
          if (@($manifest.common_manifest.PSObject.Properties).Count -ne 94) { throw 'Expected 94 common assets' }
          $oldCore=Join-Path $inputs 'production/old.dll'
          $newCore=Join-Path $env:NEW_INPUT ('blobs/'+$env:EXPECTED_NEW_CORE_SHA)
          if ((Get-FileHash $oldCore).Hash.ToLowerInvariant() -ne '4d571648599e567bb6df0cda1f823d79e95712241078c2ab1721cf7409c10173' -or (Get-FileHash $newCore).Hash.ToLowerInvariant() -ne $env:EXPECTED_NEW_CORE_SHA) { throw 'Wrong production bytes' }
          $gpuReceipt=Join-Path $env:GPU_INPUT 'receipt.json'
          Copy-Item -LiteralPath $gpuReceipt -Destination (Join-Path $env:SCREEN_ROOT 'gpu-receipt-checkout-before.bin')
          $receiptBefore=(Get-FileHash -LiteralPath $gpuReceipt -Algorithm SHA256).Hash.ToLowerInvariant()
          $gpuCheckout=Join-Path $env:GITHUB_WORKSPACE 'gpu-proof'
          $receiptRelative='benchmarks/results/shared-rollout/local-gpu-contracts/receipt.json'
          $blobStart=[Diagnostics.ProcessStartInfo]::new((Get-Command git).Source)
          $blobStart.UseShellExecute=$false;$blobStart.CreateNoWindow=$true;$blobStart.RedirectStandardOutput=$true;$blobStart.RedirectStandardError=$true
          foreach ($argument in @('-C',$gpuCheckout,'cat-file','blob',($env:GPU_RECEIPT_COMMIT+':'+$receiptRelative))) { $blobStart.ArgumentList.Add([string]$argument) }
          $blobProcess=[Diagnostics.Process]::new();$blobProcess.StartInfo=$blobStart
          try {
            if (!$blobProcess.Start()) { throw 'Cannot read pinned GPU receipt blob' }
            $blobError=$blobProcess.StandardError.ReadToEndAsync()
            $blobFile=[IO.File]::Open($gpuReceipt,[IO.FileMode]::Create,[IO.FileAccess]::Write,[IO.FileShare]::None)
            try { $blobProcess.StandardOutput.BaseStream.CopyTo($blobFile);$blobFile.Flush($true) } finally { $blobFile.Dispose() }
            $blobProcess.WaitForExit();$restoreExit=$blobProcess.ExitCode;$blobErrorText=$blobError.GetAwaiter().GetResult()
          } finally { $blobProcess.Dispose() }
          $receiptAfter=(Get-FileHash -LiteralPath $gpuReceipt -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{commit=$env:GPU_RECEIPT_COMMIT;restored_path=$receiptRelative;checkout_before_sha256=$receiptBefore;restored_after_sha256=$receiptAfter;expected_sha256=$env:EXPECTED_GPU_RECEIPT_SHA;git_cat_file_exit_code=$restoreExit;transport='git cat-file blob stdout BaseStream to FileStream';git_stderr=$blobErrorText;global_git_configuration_changed=$false} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'gpu-receipt-restoration.json') -Encoding utf8
          if ($restoreExit -ne 0) { throw 'Pinned GPU receipt blob read failed; preserve checkout evidence' }
          if ((Get-FileHash $gpuReceipt).Hash.ToLowerInvariant() -ne $env:EXPECTED_GPU_RECEIPT_SHA) { throw 'Wrong approved candidate GPU100 receipt' }
          $gpuTrx=Join-Path $env:GPU_INPUT 'gpu.trx.gz'
          if ((Get-FileHash $gpuTrx).Hash.ToLowerInvariant() -ne $env:EXPECTED_GPU_TRX_GZ_SHA) { throw 'Wrong approved GPU100 compressed TRX' }
          Copy-Item -LiteralPath $gpuTrx -Destination (Join-Path $env:SCREEN_ROOT 'candidate-gpu100.trx.gz')
          Copy-Item -LiteralPath $gpuReceipt -Destination (Join-Path $env:SCREEN_ROOT 'candidate-gpu100-receipt.json')
          Copy-Item -LiteralPath $newManifest -Destination (Join-Path $env:SCREEN_ROOT 'candidate-manifest.json')
          $common=[IO.Path]::GetFullPath((Join-Path $inputs 'common'))
          foreach ($label in @('new')) {
            $view=Join-Path $env:RUNNER_TEMP ('stoch-grid-roi-'+$label+'-runtime')
            if (Test-Path -LiteralPath $view) { throw 'Fresh runtime view required' }
            foreach ($entry in $manifest.common_manifest.PSObject.Properties) {
              $source=[IO.Path]::GetFullPath((Join-Path $common $entry.Name))
              $target=[IO.Path]::GetFullPath((Join-Path $view $entry.Name))
              if (!$source.StartsWith($common+'\',[StringComparison]::OrdinalIgnoreCase) -or !$target.StartsWith($view+'\',[StringComparison]::OrdinalIgnoreCase)) { throw 'Escaped runtime member' }
              if ((Get-FileHash $source).Hash.ToLowerInvariant() -ne $entry.Value) { throw 'Changed common input' }
              if ($entry.Name -eq 'OoplesFinance.StockIndicators.dll') { $source=if ($label -eq 'old') { $oldCore } else { $newCore } }
              [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($target)) | Out-Null
              $null=New-Item -ItemType HardLink -Path $target -Target $source -ErrorAction Stop
            }
          }
          $config=Join-Path $common 'OoplesFinance.StockIndicators.CompetitorBenchmarks.runtimeconfig.json'
          if ((Get-FileHash $config).Hash.ToLowerInvariant() -ne 'c230a317a54dd960bcbeb5f347f52e18dc665a26f7efda2159fced9a5ac7e097') { throw 'Wrong runtime configuration' }
          $helper=Join-Path $env:RUNNER_TEMP 'stoch-grid-roi-diagnostic-helper'
          [IO.Directory]::CreateDirectory($helper) | Out-Null
          @('<Project Sdk="Microsoft.NET.Sdk">','<PropertyGroup>','<OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework>','<ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable>','<UseSharedCompilation>false</UseSharedCompilation>','</PropertyGroup>','</Project>') | Set-Content (Join-Path $helper 'DiagnosticScreen.csproj') -Encoding utf8
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'scripts/screen-adosc-pinned-runtime.cs') (Join-Path $helper 'Program.cs')
          dotnet build (Join-Path $helper 'DiagnosticScreen.csproj') -c Release -o (Join-Path $helper 'out') --disable-build-servers --nologo *> (Join-Path $env:SCREEN_ROOT 'helper-build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic helper build failed; no workload' }
          $driver=Join-Path $helper 'out/DiagnosticScreen.dll'
          [ordered]@{helper_sha256=(Get-FileHash $driver).Hash.ToLowerInvariant();helper_source_sha256=(Get-FileHash (Join-Path $helper 'Program.cs')).Hash.ToLowerInvariant();sdk='10.0.403';production_builds=0;diagnostic_driver_builds=1;hardlinks=94;payload_copies=0;runtimeconfig_sha256=(Get-FileHash $config).Hash.ToLowerInvariant();qualification=$false} | ConvertTo-Json | Set-Content (Join-Path $env:SCREEN_ROOT 'launch.json') -Encoding utf8
          dotnet --info | Set-Content (Join-Path $env:SCREEN_ROOT 'dotnet-info.txt') -Encoding utf8
      - name: Capture one authenticated candidate CPU profile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $inputs=Join-Path $env:OLD_INPUT 'predicate-inputs'
          $runtime=Join-Path $env:RUNNER_TEMP 'stoch-grid-roi-new-runtime'
          $config=Join-Path $inputs 'common/OoplesFinance.StockIndicators.CompetitorBenchmarks.runtimeconfig.json'
          $driver=Join-Path $env:RUNNER_TEMP 'stoch-grid-roi-diagnostic-helper/out/DiagnosticScreen.dll'
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts/screen-adosc-pinned-runtime.cs'
          $dotnet=(Get-Command dotnet).Source
          $identity=[Security.Principal.WindowsIdentity]::GetCurrent()
          $principal=[Security.Principal.WindowsPrincipal]::new($identity)
          if (!$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'Kernel capture requires administrator' }
          $tool=Join-Path $env:RUNNER_TEMP 'stoch-grid-PerfView-4.0.0.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/perfview/releases/download/v4.0.0/PerfView.exe' -OutFile $tool
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne '270e2ba419b0b2d93c4b15b0851f257edf655c92fe0ad95add3d0b5f6d6aad48') { throw 'Wrong PerfView bytes' }
          $pdbHash='a0a72191f46e8c56f6cb18938a0c9da144651da3a735df723126b65ccf144fb6'
          $candidateManifest=Join-Path $env:NEW_INPUT 'manifest.json'
          $candidateProof=Get-Content -LiteralPath $candidateManifest -Raw | ConvertFrom-Json
          if ($candidateProof.runtime_files.'src/bin/Release/net10.0/OoplesFinance.StockIndicators.pdb' -ne $pdbHash) { throw 'PDB manifest binding mismatch' }
          $pdbSource=Join-Path $env:NEW_INPUT ('blobs/'+$pdbHash)
          if ((Get-FileHash -LiteralPath $pdbSource -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pdbHash) { throw 'Wrong candidate PDB bytes' }
          $symbols=Join-Path $env:SCREEN_ROOT 'symbols'
          [IO.Directory]::CreateDirectory($symbols) | Out-Null
          Copy-Item -LiteralPath $pdbSource -Destination (Join-Path $symbols 'OoplesFinance.StockIndicators.pdb')
          $env:_NT_SYMBOL_PATH=$symbols
          [ordered]@{pdb_sha256=$pdbHash;production_sha256=$env:EXPECTED_NEW_CORE_SHA;source='0129b49e750feaee5bbc0ff4391ec90692a9f596';manifest_sha256=$env:EXPECTED_MANIFEST_SHA;protected_runtime_pdb_replaced=$false;separate_symbol_root=$symbols} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'symbols.json') -Encoding utf8
          function IdleGate($name) {
            $samples=[Collections.Generic.List[double]]::new()
            for ($i=0;$i -lt 12;$i++) {
              $samples.Add((Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 1 -MaxSamples 1).CounterSamples[0].CookedValue)
            }
            $busy=@(Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^(dotnet|MSBuild|testhost|VBCSCompiler)(\.exe)?$' -and $_.CommandLine -match '(?i)(\s(build|test|vstest)\s|MSBuild\.(exe|dll)|testhost|VBCSCompiler)' } | Select-Object ProcessId,Name,CommandLine)
            $passed=$samples.Count -eq 12 -and @($samples | Where-Object { ![double]::IsFinite($_) -or $_ -lt 0 -or $_ -ge 15 }).Count -eq 0 -and $busy.Count -eq 0
            [ordered]@{cpu_percent=$samples.ToArray();build_test_processes=$busy;passed=$passed;utc=[DateTime]::UtcNow.ToString('O')} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT ($name+'.json')) -Encoding utf8
            return $passed
          }
          # Fixed preparation only: these probes never replace mandatory gate samples.
          $initializationProbes=(Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 1 -MaxSamples 2).CounterSamples.CookedValue
          [ordered]@{cpu_percent=@($initializationProbes);preparation_only=$true;mandatory_gate_samples=12;settle_seconds=5;utc=[DateTime]::UtcNow.ToString('O')} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'cpu-probe-preparation.json') -Encoding utf8
          Start-Sleep -Seconds 5
          $prePassed=IdleGate 'idle-before'
          if (!$prePassed) { throw 'Pre-capture idle gate failed; no capture' }
          $trace=Join-Path $env:SCREEN_ROOT 'cpu.etl'
          $collectionLog=Join-Path $env:SCREEN_ROOT 'cpu.log'
          $replay=Join-Path $env:SCREEN_ROOT 'replay'
          $arguments=@('/AcceptEula','/NoGui','/NoView','/KernelEvents:Process,Thread,ImageLoad,Profile',
            '/ClrEvents:Jit,Loader,JittedMethodILToNativeMap','/FocusProcess:dotnet.exe',
            '/BufferSizeMB:16','/CircularMB:32','/MaxCollectSec:40','/Merge:false','/Zip:false',('/DataFile:'+$trace),('/LogFile:'+$collectionLog),
            'run',$dotnet,'exec','--runtimeconfig',$config,$driver,$inputs,$runtime,$env:NEW_INPUT,(Join-Path $env:GPU_INPUT 'receipt.json'),'new','TaLib.Functions.Stoch',$replay)
          $launch=[ordered]@{command=$tool;arguments=$arguments;diagnostic_driver_sha256=(Get-FileHash -LiteralPath $driver -Algorithm SHA256).Hash.ToLowerInvariant();diagnostic_driver_builds=1;production_builds=0;tests=0;timed_benchmark_cases=0;runtimeconfig_sha256=(Get-FileHash -LiteralPath $config -Algorithm SHA256).Hash.ToLowerInvariant();script_sha256=(Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash.ToLowerInvariant();child_timeout_seconds=60;output_cap_bytes=104857600;runtime_payload_copy_bytes=0;diagnostic_only=$true;qualification=$false}
          $launch | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'capture-launch.json') -Encoding utf8
          $startInfo=[Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName=$tool; $startInfo.UseShellExecute=$false; $startInfo.CreateNoWindow=$true
          $startInfo.RedirectStandardOutput=$true; $startInfo.RedirectStandardError=$true
          foreach ($argument in $arguments) { $startInfo.ArgumentList.Add([string]$argument) }
          $process=[Diagnostics.Process]::new();$process.StartInfo=$startInfo
          $clock=[Diagnostics.Stopwatch]::StartNew();$failure=$null;$started=$false;$capturePassed=$false;$postPassed=$false;$validationFailure=$null
          try {
            if (!$process.Start()) { throw 'Cannot start existing diagnostic tool' }
            $started=$true
            $stdout=$process.StandardOutput.ReadToEndAsync();$stderr=$process.StandardError.ReadToEndAsync()
            while (!$process.WaitForExit(250)) {
              $bytes=(Get-ChildItem -LiteralPath $env:SCREEN_ROOT -Recurse -File | Measure-Object Length -Sum).Sum
              if ($clock.Elapsed.TotalSeconds -gt 60) { $failure='60 second child watchdog'; break }
              if ($bytes -gt 104857600) { $failure='100MiB output cap'; break }
            }
            if ($failure) { $process.Kill($true);$process.WaitForExit() }
            $stdout.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'capture.log') -Encoding utf8
            $stderr.GetAwaiter().GetResult() | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'capture-error.log') -Encoding utf8
            $bytes=(Get-ChildItem -LiteralPath $env:SCREEN_ROOT -Recurse -File | Measure-Object Length -Sum).Sum
            if ($bytes -gt 104857600) { $failure='100MiB output cap after exit' }
            [ordered]@{exit_code=$process.ExitCode;elapsed_seconds=$clock.Elapsed.TotalSeconds;limit_failure=$failure;output_bytes=$bytes;diagnostic_only=$true;qualification=$false} |
              ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'capture.json') -Encoding utf8
            if ($failure -or $process.ExitCode -ne 0) { throw 'Capture failed; preserve all existing output' }
            foreach ($rawName in @('cpu.etl','cpu.kernel.etl','cpu.clrRundown.etl')) {
              $rawPath=Join-Path $env:SCREEN_ROOT $rawName
              if (!(Test-Path -LiteralPath $rawPath -PathType Leaf) -or (Get-Item -LiteralPath $rawPath).Length -le 0) { throw 'Required raw ETL missing or empty' }
            }
            if (Test-Path -LiteralPath ($trace+'.zip')) { throw 'Unexpected runner ZIP; raw-only capture required' }
            $collectorText=Get-Content -LiteralPath $collectionLog -Raw
            if ($collectorText -notmatch ' SUCCESS:' -or $collectorText -match '\[Error:' -or $collectorText -match '\[Merging data files') { throw 'Collector did not report clean raw-only success' }
            if ((Get-FileHash -LiteralPath (Join-Path $symbols 'OoplesFinance.StockIndicators.pdb') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pdbHash) { throw 'Symbol bytes changed' }
            $receipt=Get-Content -LiteralPath (Join-Path $replay 'replay.json') -Raw | ConvertFrom-Json
            if ($receipt.status -ne 'complete' -or $receipt.pair -ne 'TaLib.Functions.Stoch' -or $receipt.warmups -ne 1000 -or $receipt.profile_seconds -ne 10 -or $receipt.actual_clr -ne '10.0.15' -or $receipt.arm -ne 'new' -or $receipt.new_production_sha256 -ne $env:EXPECTED_NEW_CORE_SHA -or !$receipt.protected_inputs_unchanged -or !$receipt.runtime_unchanged) { throw 'Replay incomplete, mismatched or runtime changed' }
            $settings=$receipt.settings_before | ConvertTo-Json -Compress
            if ($receipt.processor_count -ne 4 -or $receipt.settings_before.dop -ne 2 -or $receipt.settings_before.effective_workers -ne 2 -or $settings -cne ($receipt.settings_after_setup | ConvertTo-Json -Compress) -or $settings -cne ($receipt.settings_after | ConvertTo-Json -Compress)) { throw 'Candidate worker settings changed' }
            if ($receipt.factory_parameters.window -ne 5 -or $receipt.factory_parameters.k -ne 3 -or $receipt.factory_parameters.d -ne 3 -or $receipt.factory_parameters.fast -or $receipt.factory_parameters.km -ne 'Sma' -or $receipt.factory_parameters.dm -ne 'Sma' -or $receipt.factory_parameters.first -or $receipt.factory_parameters.suppression -ne 0) { throw 'Candidate Stoch parameters changed' }
            if ($receipt.candidate_symbol_identity.guid -ne '9615e644223546ecbb276030fe50f7bf' -or $receipt.candidate_symbol_identity.stamp -ne 'bf3c3403' -or $receipt.candidate_symbol_identity.age -ne 1 -or $receipt.candidate_symbol_identity.pdb_sha256 -ne $pdbHash -or $receipt.candidate_symbol_identity.protected_runtime_pdb_replaced) { throw 'Candidate PE/PDB identity missing or mismatched' }
            $capturePassed=$true
          } catch {
            $validationFailure=$_.Exception.ToString()
            throw
          } finally {
            if ($started -and !$process.HasExited) { $process.Kill($true);$process.WaitForExit() }
            $process.Dispose()
            if ($started) {
              try { $postPassed=IdleGate 'idle-after' }
              catch { $validationFailure=([string]$validationFailure)+' Post-gate error: '+$_.Exception.ToString() }
            }
            $finalBytes=(Get-ChildItem -LiteralPath $env:SCREEN_ROOT -Recurse -File | Measure-Object Length -Sum).Sum
            if ($finalBytes -gt 104857600) { $capturePassed=$false;$validationFailure=([string]$validationFailure)+' 100MiB final output cap' }
            $valid=$capturePassed -and $prePassed -and $postPassed -and $null -eq $validationFailure
            $profileValidation=[ordered]@{profile_valid_for_diagnostic_only=$valid;pre_idle_passed=$prePassed;post_idle_passed=$postPassed;raw_capture_complete=$capturePassed;failure=$validationFailure;output_bytes=$finalBytes;qualification=$false;native_win_claim=$false;source_imported=$false;report_imported=$false}
            $profileValidation | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'profile-validation.json') -Encoding utf8
            Get-ChildItem -LiteralPath $env:SCREEN_ROOT -Recurse -File | ForEach-Object {
              [ordered]@{path=$_.FullName.Substring($env:SCREEN_ROOT.Length);bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'output-manifest.json') -Encoding utf8
            $sealedBytes=(Get-ChildItem -LiteralPath $env:SCREEN_ROOT -Recurse -File | Measure-Object Length -Sum).Sum
            if ($sealedBytes -gt 104857600) {
              $valid=$false;$profileValidation.profile_valid_for_diagnostic_only=$false;$profileValidation.output_bytes=$sealedBytes
              $profileValidation.failure=([string]$profileValidation.failure)+' 100MiB output cap including final metadata'
              $profileValidation | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'profile-validation.json') -Encoding utf8
              Get-ChildItem -LiteralPath $env:SCREEN_ROOT -Recurse -File | Where-Object { $_.FullName -ne (Join-Path $env:SCREEN_ROOT 'output-manifest.json') } | ForEach-Object {
                [ordered]@{path=$_.FullName.Substring($env:SCREEN_ROOT.Length);bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
              } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:SCREEN_ROOT 'output-manifest.json') -Encoding utf8
            }
            if (!$valid) { throw 'Capture invalid, incomplete or idle gate failed; preserve all evidence' }
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stoch-grid-cpu-profile
          path: ${{ env.SCREEN_ROOT }}/
          retention-days: 14
          if-no-files-found: error
