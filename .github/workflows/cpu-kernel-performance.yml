name: CPU kernel pilot performance
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Public builder comparisons, diagnostic kernels, or both
        type: choice
        options: [builder, kernel, all, qualified-rollout, qualified-variants, qualified-coverage, qualified-targeted, verify-evidence, trix-diagnostic, trix-library-diagnostic, build-correctness-inputs]
        default: builder
      qualification_plan:
        description: Immutable source and measurement plan for qualified-rollout
        type: choice
        options: [benchmarks/plans/hosted-rollout-20261101.json, benchmarks/plans/hosted-repair-20261101.json, benchmarks/plans/hosted-trix-20261102.json, benchmarks/plans/hosted-trix-eager-20261102.json, benchmarks/plans/hosted-trix-shared-jit-20261102.json, benchmarks/plans/hosted-trix-direct-fill-20261102.json, benchmarks/plans/hosted-trix-settled-20261102.json, benchmarks/plans/hosted-trix-word-settled-20261102.json, benchmarks/plans/hosted-classical-final-20261102.json, benchmarks/plans/hosted-builder-coverage-20261102.json, benchmarks/plans/hosted-builder-coverage-repair-20261103.json, benchmarks/plans/hosted-hilbert-fir-20261102.json, benchmarks/plans/hosted-ad-cumulative-20261103.json, benchmarks/plans/hosted-klinger-schaff-20261103.json, benchmarks/plans/hosted-dispersion-20261103.json, benchmarks/plans/hosted-builder-coverage-native-one-20261103.json, benchmarks/plans/hosted-ad-small-first-20261103.json, benchmarks/plans/hosted-combined-accepted-20261103.json, benchmarks/plans/hosted-tsi-compact-ema-20261103.json, benchmarks/plans/hosted-pmo-compact-ema-20261103.json, benchmarks/plans/hosted-quartic-interval-20261103.json, benchmarks/plans/hosted-combined-compact-kernels-20261103.json, benchmarks/plans/hosted-stoch-compact-smoothing-20261103.json, benchmarks/plans/hosted-sum-directional-range-20261103.json, benchmarks/plans/hosted-trend-star-compact-ranks-20261103.json, benchmarks/plans/hosted-stoch-raw-certificate-20261103.json, benchmarks/plans/hosted-trend-star-certified-bodies-20261103.json, benchmarks/plans/hosted-combined-local-certificates-20261103.json, benchmarks/plans/hosted-curvature-wide-slope-20261103.json, benchmarks/plans/hosted-curvature-packed-statistics-20261103.json, benchmarks/plans/hosted-envelope-coefficient-cache-20261103.json, benchmarks/plans/hosted-pvo-certified-ema-20261103.json, benchmarks/plans/hosted-envelope-band-certificate-20261103.json, benchmarks/plans/hosted-pvo-volume-dispatch-20261103.json, benchmarks/plans/hosted-adx-weighted-certificate-20261104.json, benchmarks/plans/hosted-fisher-exact-inputs-20261104.json, benchmarks/plans/hosted-combined-private-inputs-20261104.json, benchmarks/plans/hosted-awesome-private-arithmetic-20261104.json, benchmarks/plans/hosted-crow-soldier-active-snapshots-20261104.json, benchmarks/plans/hosted-prior-directional-weighted-certificate-20261104.json, benchmarks/plans/hosted-smoothed-accumulation-certified-ema-20261104.json, benchmarks/plans/hosted-combined-directional-accumulation-20261104.json, benchmarks/plans/hosted-combined-directional-accumulation-cap-20261104.json, benchmarks/plans/hosted-prior-directional-raw-stages-20261104.json, benchmarks/plans/hosted-prior-directional-ratios-20261104.json, benchmarks/plans/hosted-klinger-private-blend-20261104.json, benchmarks/plans/hosted-combined-ratio-klinger-20261104.json, benchmarks/plans/hosted-klinger-after-directional-ratios-20261104.json, benchmarks/plans/hosted-classic-ppo-normalization-20261104.json, benchmarks/plans/hosted-log-return-short-certificate-20261104.json, benchmarks/plans/hosted-classic-oscillator-finite-inputs-20261104.json, benchmarks/plans/hosted-sum-directional-normalization-20261104.json, benchmarks/plans/hosted-pvo-normalization-20261105.json, benchmarks/plans/hosted-seeded-hilbert-midpoint-20261105.json, benchmarks/plans/hosted-pvo-adjacent-certificate-20261105.json, benchmarks/plans/hosted-beta-derived-ratio-20261105.json, benchmarks/plans/hosted-beta-derived-ratio-v2-20261105.json, benchmarks/plans/hosted-atr-published-width-20261105.json, benchmarks/plans/hosted-deviation-position-certificate-20261105.json, benchmarks/plans/hosted-doji-shadow-comparison-20261105.json, benchmarks/plans/hosted-renko-price-grid-20261105.json, benchmarks/plans/hosted-price-relative-compact-mean-20261105.json, benchmarks/plans/hosted-volatility-stop-finite-stages-20261105.json, benchmarks/plans/hosted-combined-renko-mean-stop-20261105.json, benchmarks/plans/hosted-renko-direct-coordinates-20261105.json, benchmarks/plans/hosted-renko-compact-volume-20261105.json, benchmarks/plans/hosted-renko-price-normalization-20261105.json, benchmarks/plans/hosted-renko-endpoint-cache-20261105.json, benchmarks/plans/hosted-adl-component-sharing-zero-20261105.json, benchmarks/plans/hosted-adl-exact-product-fallback-20261106.json, benchmarks/plans/hosted-zigzag-coordinate-normalization-20261106.json, benchmarks/plans/hosted-combined-containment-mfi-20261106.json, benchmarks/plans/hosted-hilbert-variable-window-20261107.json, benchmarks/plans/hosted-hilbert-coefficient-certificates-20261107.json, benchmarks/plans/hosted-hilbert-phase-only-trigonometry-20261107.json, benchmarks/plans/hosted-hilbert-followup-composition-20261107.json, benchmarks/plans/hosted-hilbert-finite-bit-steps-20261107.json, benchmarks/plans/hosted-hilbert-residual-bound-20261107.json, benchmarks/plans/hosted-body-shadow-retained-differences-20261107.json, benchmarks/plans/hosted-sum-directional-exact-movement-20261107.json, benchmarks/plans/hosted-hilbert-accumulation-directional-composition-20261107.json, benchmarks/plans/hosted-body-shadow-compact-slot-20261108.json, benchmarks/plans/hosted-adl-batch-wide-publication-20261108.json, benchmarks/plans/hosted-hilbert-lag-zero-seed-20261108.json, benchmarks/plans/hosted-hilbert-ordered-sum-20261108.json, benchmarks/plans/hosted-hilbert-floating-grid-guard-20261108.json, benchmarks/plans/hosted-prior-directional-single-loop-20261108.json, benchmarks/plans/hosted-prior-directional-lazy-factors-20261108.json, benchmarks/plans/hosted-prior-directional-dx-ratio-20261108.json, benchmarks/plans/hosted-trix-scalar-stage-storage-20261108.json, benchmarks/plans/hosted-trix-rate-certificate-20261109.json, benchmarks/plans/hosted-adl-batch-balanced-product-20261109.json, benchmarks/plans/hosted-trix-private-update-work-20261109.json, benchmarks/plans/hosted-adl-price-bounds-20261109.json, benchmarks/plans/hosted-adl-direct-prefix-publication-20261109.json, benchmarks/plans/hosted-beta-return-bounds-20261109.json, benchmarks/plans/hosted-adl-fixed-grid-20261109.json, benchmarks/plans/hosted-adl-four-difference-bounds-20261109.json, benchmarks/plans/hosted-adl-cached-word-mean-20261109.json, benchmarks/plans/hosted-adl-direct-binary-publication-20261109.json, benchmarks/plans/hosted-adl-identity-column-20261109.json, benchmarks/plans/hosted-adl-batch-four-bounds-20261109.json]
        default: benchmarks/plans/hosted-rollout-20261101.json
      evidence_run:
        description: Original measurement run for verification-only recovery
        type: string
        default: ''
      collector_ref:
        description: Exact original collector commit for verification-only recovery
        type: string
        default: ''
      evidence_phase:
        description: Original evidence phase for verification-only recovery
        type: choice
        options: [variants, coverage, targeted]
        default: variants
      candidate_source:
        description: Immutable source SHA for CPU build and later local GPU validation
        type: string
        default: ''
      candidate_unit_classes:
        description: Comma-separated focused unit classes
        type: string
        default: ''
      candidate_parity_classes:
        description: Comma-separated focused comparator classes
        type: string
        default: ''
env:
  HOSTED_TIMING_PLAN: ${{ inputs.qualification_plan || 'benchmarks/plans/hosted-rollout-20261101.json' }}
permissions:
  contents: read
concurrency:
  group: cpu-kernels-${{ github.ref }}-${{ inputs.suite == 'verify-evidence' && format('verify-{0}', inputs.evidence_run) || github.event.label.name || 'dispatch' }}
  cancel-in-progress: true
jobs:
  candidate-correctness-inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'build-correctness-inputs'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
      CANDIDATE_UNIT: ${{ inputs.candidate_unit_classes }}
      CANDIDATE_PARITY: ${{ inputs.candidate_parity_classes }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: tooling
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_source }}
          path: candidate
          persist-credentials: false
          sparse-checkout: |
            src
            tests
            examples
            scripts
            benchmarks/OoplesFinance.StockIndicators.CompetitorBenchmarks
            benchmarks/OoplesFinance.StockIndicators.CompetitorTests
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify package identity and integrity gates
        run: python -m unittest discover -s tooling/scripts -p test_candidate_correctness_inputs.py
      - name: Build and run focused CPU checks without claiming GPU validation
        shell: pwsh
        run: |
          python tooling/scripts/build-candidate-correctness.py --repo candidate --out candidate-correctness-inputs --source $env:CANDIDATE_SOURCE --unit $env:CANDIDATE_UNIT --parity $env:CANDIDATE_PARITY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-correctness-inputs
          path: candidate-correctness-inputs
          if-no-files-found: error
  build:
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["builder", "kernel", "all"]'), inputs.suite)) || github.event.label.name == 'run-builder-benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: python -m unittest discover -s scripts -p test_verify_cpu_kernel_performance.py
      - run: dotnet build benchmarks/OoplesFinance.StockIndicators.CompetitorTests -c Release -p:GeneratePackageOnBuild=false
      - run: dotnet test benchmarks/OoplesFinance.StockIndicators.CompetitorTests -c Release --no-build --filter "FullyQualifiedName~CpuKernelTests|FullyQualifiedName~CpuNativeBenchmarkTests|FullyQualifiedName~CpuBuilderBenchmarkTests|FullyQualifiedName~AsinSpanTests|FullyQualifiedName~CpuFeasibilityTests"
      - uses: actions/upload-artifact@v7
        with:
          name: cpu-pilot-binaries
          path: benchmarks/OoplesFinance.StockIndicators.CompetitorBenchmarks/bin/Release/net10.0/
          retention-days: 7
  performance:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["kernel", "all"]'), inputs.suite)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pair: [QuanTAlib.Jma, QuanTAlib.Atr, Skender.GetRollingPivots, Skender.GetFractal, TaLib.Candles.RickshawMan, TaLib.Functions.Asin, Trady.Candlestick.BullishShortDay, Trady.Indicator.SimpleMovingAverage]
    env:
      COMPARISON_PAIR: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: cpu-pilot-binaries
          path: binaries
      - run: dotnet binaries/OoplesFinance.StockIndicators.CompetitorBenchmarks.dll --filter '*CpuKernelBenchmarks*' --exporters json --artifacts performance
      - run: python scripts/verify-cpu-kernel-performance.py performance "$COMPARISON_PAIR" > performance/verified.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpu-pilot-${{ matrix.pair }}
          path: performance/
          retention-days: 14
  builder-performance:
    if: contains(fromJSON('["builder", "all"]'), inputs.suite) || github.event.label.name == 'run-builder-benchmarks'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pair: [QuanTAlib.Jma, QuanTAlib.Atr, Skender.GetRollingPivots, Skender.GetFractal, TaLib.Candles.RickshawMan, TaLib.Functions.Asin, Trady.Candlestick.BullishShortDay, Trady.Indicator.SimpleMovingAverage]
    env:
      COMPARISON_FAMILY: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: cpu-pilot-binaries
          path: binaries
      - run: dotnet binaries/OoplesFinance.StockIndicators.CompetitorBenchmarks.dll --filter '*CpuBuilderBenchmarks*' --exporters json --artifacts performance
      - run: python scripts/verify-cpu-kernel-performance.py performance "$COMPARISON_FAMILY" --suite builder --family > performance/verified.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpu-builder-${{ matrix.pair }}
          path: performance/
          retention-days: 14
  trix-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'trix-diagnostic'
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [trix-jit, trix-no-pgo]
    env:
      HOSTED_TIMING_PLAN: benchmarks/plans/hosted-repair-20261101.json
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
          run-id: 41367778664
          github-token: ${{ github.token }}
      - run: python scripts/run-hosted-timing.py measure --inputs hosted-inputs --out diagnostic-${{ matrix.profile }} --phase successor --shard 6 --diagnostic ${{ matrix.profile }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-${{ matrix.profile }}
          path: diagnostic-${{ matrix.profile }}/
          retention-days: 14
          if-no-files-found: error
  trix-library-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'trix-library-diagnostic'
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [trix-library-jit, trix-library-no-tiering, trix-library-warmup]
    env:
      HOSTED_TIMING_PLAN: benchmarks/plans/hosted-trix-direct-fill-20261102.json
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
          run-id: 41462623234
          github-token: ${{ github.token }}
      - run: python scripts/run-hosted-timing.py measure --inputs hosted-inputs --out diagnostic-${{ matrix.profile }} --phase successor --shard 1 --diagnostic ${{ matrix.profile }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-${{ matrix.profile }}
          path: diagnostic-${{ matrix.profile }}/
          retention-days: 14
          if-no-files-found: error
  hosted-prepare:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["qualified-rollout", "qualified-variants", "qualified-coverage", "qualified-targeted"]'), inputs.suite)
    env:
      HOSTED_TIMING_SUITE: ${{ inputs.suite }}
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      trix_preflight: ${{ steps.prepare.outputs.trix_preflight }}
      standalone_variants: ${{ steps.prepare.outputs.standalone_variants }}
      coverage_only: ${{ steps.prepare.outputs.coverage_only }}
      coverage_matrix: ${{ steps.prepare.outputs.coverage_matrix }}
      coverage_timeout: ${{ steps.prepare.outputs.coverage_timeout }}
      targeted_only: ${{ steps.prepare.outputs.targeted_only }}
      targeted_matrix: ${{ steps.prepare.outputs.targeted_matrix }}
      targeted_max_parallel: ${{ steps.prepare.outputs.targeted_max_parallel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s scripts -p "test_hosted*.py"
      - id: input-source
        run: |
          $timingPlan = Get-Content -Raw -LiteralPath $env:HOSTED_TIMING_PLAN | ConvertFrom-Json
          "run_id=$($timingPlan.reuse_inputs.run_id)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v8
        if: steps.input-source.outputs.run_id != ''
        with:
          name: hosted-inputs
          path: reused-inputs
          run-id: ${{ steps.input-source.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: prepare
        run: |
          if (Test-Path -LiteralPath reused-inputs) {
            python scripts/run-hosted-timing.py prepare --out hosted-inputs --reuse-from reused-inputs
          } else {
            python scripts/run-hosted-timing.py prepare --out hosted-inputs
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-inputs
          path: hosted-inputs/
          retention-days: 14
          if-no-files-found: error
  hosted-trix-preflight:
    needs: hosted-prepare
    if: needs.hosted-prepare.outputs.trix_preflight == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      accepted: ${{ steps.verify.outputs.accepted }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - run: python scripts/run-hosted-timing.py measure --inputs hosted-inputs --out preflight-raw/trix --phase successor --shard 0 --diagnostic trix-preflight
      - id: verify
        run: python scripts/run-hosted-timing.py collect-preflight --inputs preflight-raw --out verified-preflight.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-trix-preflight
          path: |
            preflight-raw/trix/
            verified-preflight.json
          retention-days: 14
          if-no-files-found: error
  hosted-measure:
    needs: [hosted-prepare, hosted-trix-preflight]
    if: always() && inputs.suite == 'qualified-rollout' && needs.hosted-prepare.result == 'success' && (needs.hosted-trix-preflight.result == 'skipped' || needs.hosted-trix-preflight.outputs.accepted == 'true')
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - run: python scripts/run-hosted-timing.py measure --inputs hosted-inputs --out hosted-successor-${{ matrix.shard }} --phase successor --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-successor-${{ matrix.shard }}
          path: hosted-successor-${{ matrix.shard }}/
          retention-days: 14
          if-no-files-found: error
  hosted-collect:
    needs: hosted-measure
    if: always() && needs.hosted-measure.result != 'skipped'
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      accepted: ${{ steps.verify.outputs.accepted }}
      run_variants: ${{ steps.verify.outputs.run_variants }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: hosted-successor-*
          path: evidence
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - id: verify
        run: python scripts/run-hosted-timing.py collect --inputs evidence --out verified-successor.json --phase successor
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-verified-successor
          path: verified-successor.json
          retention-days: 14
  hosted-variants:
    needs: [hosted-prepare, hosted-collect]
    if: always() && needs.hosted-prepare.result == 'success' && (needs.hosted-collect.outputs.run_variants == 'true' || (inputs.suite == 'qualified-variants' && needs.hosted-prepare.outputs.standalone_variants == 'true'))
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - run: python scripts/run-hosted-timing.py measure --inputs hosted-inputs --out hosted-variants-0 --phase variants --shard 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-variants-0
          path: hosted-variants-0/
          retention-days: 14
          if-no-files-found: error
  hosted-targeted:
    needs: hosted-prepare
    if: inputs.suite == 'qualified-targeted' && needs.hosted-prepare.outputs.targeted_only == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.hosted-prepare.outputs.targeted_max_parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.hosted-prepare.outputs.targeted_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - run: python scripts/run-hosted-timing.py measure --inputs hosted-inputs --out hosted-targeted-${{ matrix.shard }} --phase targeted --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-targeted-${{ matrix.shard }}
          path: hosted-targeted-${{ matrix.shard }}/
          retention-days: 14
          if-no-files-found: error
  hosted-collect-targeted:
    needs: [hosted-prepare, hosted-targeted]
    if: always() && needs.hosted-targeted.result != 'skipped'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: hosted-targeted-*
          # A single artifact is flattened; preserve its shard container.
          path: evidence${{ needs.hosted-prepare.outputs.targeted_matrix == '[0]' && '/hosted-targeted-0' || '' }}
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - run: python scripts/run-hosted-timing.py collect --inputs evidence --out verified-targeted.json --phase targeted
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-verified-targeted
          path: verified-targeted.json
          retention-days: 14
  hosted-coverage:
    needs: hosted-prepare
    if: inputs.suite == 'qualified-coverage' && needs.hosted-prepare.outputs.coverage_only == 'true'
    runs-on: windows-2025
    timeout-minutes: ${{ fromJSON(needs.hosted-prepare.outputs.coverage_timeout) }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.hosted-prepare.outputs.coverage_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.2.2
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - run: python scripts/run-hosted-timing.py measure --inputs hosted-inputs --out hosted-coverage-${{ matrix.shard }} --phase coverage --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hosted-coverage-${{ matrix.shard }}
          path: hosted-coverage-${{ matrix.shard }}/
          retention-days: 14
          if-no-files-found: error
  hosted-collect-coverage:
    needs: hosted-coverage
    if: always() && needs.hosted-coverage.result != 'skipped'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: hosted-coverage-*
          path: evidence
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - run: python scripts/run-hosted-timing.py collect --inputs evidence --out verified-coverage.json --phase coverage
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-verified-coverage
          path: verified-coverage.json
          retention-days: 14
  hosted-collect-variants:
    needs: hosted-variants
    if: always() && needs.hosted-variants.result != 'skipped'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: hosted-variants-0
          path: evidence/hosted-variants-0
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
      - run: python scripts/run-hosted-timing.py collect --inputs evidence --out verified-variants.json --phase variants
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-verified-variants
          path: verified-variants.json
          retention-days: 14
  hosted-verify-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'verify-evidence'
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      MEASUREMENT_RUN: ${{ inputs.evidence_run }}
      COLLECTOR_REF: ${{ inputs.collector_ref }}
      EVIDENCE_PHASE: ${{ inputs.evidence_phase }}
    steps:
      - name: Validate evidence identity
        run: |
          if ($env:MEASUREMENT_RUN -notmatch '^[1-9][0-9]+$') { throw 'An original measurement run is required' }
          if ($env:COLLECTOR_REF -notmatch '^[0-9a-f]{40}$') { throw 'An exact collector commit is required' }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.collector_ref }}
          fetch-depth: 0
          sparse-checkout: |
            scripts
            benchmarks/plans
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: hosted-inputs
          path: hosted-inputs
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: hosted-${{ inputs.evidence_phase }}-0
          path: evidence/hosted-${{ inputs.evidence_phase }}-0
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
      - name: Bind original run, collector, and frozen plan
        run: |
          @'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from hosted_timing.pipeline import PLAN, digest, read
          proof = read(Path('hosted-inputs/provenance.json'))
          assert proof['run_id'] == os.environ['MEASUREMENT_RUN']
          assert proof['workflow_head'] == os.environ['COLLECTOR_REF']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == proof['workflow_head']
          assert proof['plan_sha256'] == digest(PLAN)
          note = dict(measurement_run_id=proof['run_id'], collector_ref=proof['workflow_head'],
                      verification_run_id=os.environ['GITHUB_RUN_ID'], phase=os.environ['EVIDENCE_PHASE'],
                      plan_sha256=proof['plan_sha256'], timings_rerun=False)
          Path('collection-recovery.json').write_bytes((json.dumps(note, indent=2)+'\n').encode())
          '@ | python -
      - name: Verify original complete evidence
        run: python scripts/run-hosted-timing.py collect --inputs evidence --prepared hosted-inputs --out verified-evidence.json --phase $env:EVIDENCE_PHASE
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-recovered-${{ inputs.evidence_phase }}
          path: |
            verified-evidence.json
            collection-recovery.json
          retention-days: 14
