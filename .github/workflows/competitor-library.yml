name: Recovery source-matched builds
run-name: Recovery build ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to compile
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: recovery-build-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Enable long Git paths on the hosted Windows runner
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify exact source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -cne $env:EXPECTED_SOURCE) { throw 'Source mismatch' }
          if ($env:EXPECTED_SOURCE -cnotmatch '^[0-9a-f]{40}$') { throw 'Full source SHA required' }
      - name: build-net461
        run: dotnet build src/OoplesFinance.StockIndicators.csproj -c Release -f net461 -p:GeneratePackageOnBuild=false -m:1
      - name: build-net10
        run: dotnet build src/OoplesFinance.StockIndicators.csproj -c Release -f net10.0 --no-restore -p:GeneratePackageOnBuild=false -m:1
      - name: build-unit
        run: dotnet build tests/OoplesFinance.StockIndicators.Tests.Unit.csproj -c Release -p:GeneratePackageOnBuild=false -m:1
      - name: build-comparator
        run: dotnet build benchmarks/OoplesFinance.StockIndicators.CompetitorTests -c Release -p:GeneratePackageOnBuild=false -m:1
      - name: Record source and complete binary hashes
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          roots=['src/bin/Release/net461','src/bin/Release/net10.0','tests/bin/Release/net10.0','benchmarks/OoplesFinance.StockIndicators.CompetitorBenchmarks/bin/Release/net10.0','benchmarks/OoplesFinance.StockIndicators.CompetitorTests/bin/Release/net10.0']
          files={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for root in roots for p in Path(root).rglob('*') if p.is_file()}
          dlls={name:value for name,value in files.items() if name.endswith('/OoplesFinance.StockIndicators.dll') and '/net10.0/' in name}
          assert len(dlls)==4 and len(set(dlls.values()))==1,dlls
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          Path('recovery-build-manifest.json').write_text(json.dumps({'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'workflow_sha':os.environ['WORKFLOW_SHA'],'run_id':int(os.environ['RUN_ID']),'production_dll_sha256':dlls,'files_sha256':files},indent=2))
      - uses: actions/upload-artifact@v7
        with:
          name: recovery-binaries
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            recovery-build-manifest.json
            src/bin/Release/net461/
            src/bin/Release/net10.0/
            tests/bin/Release/net10.0/
            benchmarks/OoplesFinance.StockIndicators.CompetitorBenchmarks/bin/Release/net10.0/
            benchmarks/OoplesFinance.StockIndicators.CompetitorTests/bin/Release/net10.0/
