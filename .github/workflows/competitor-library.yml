name: Certified SMA competitor timing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sma-competitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPARISON_PAIR: Skender.GetSmaAnalysis
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify source and wait for the existing CI build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          repo='Ooples-Finance-LLC/OoplesFinance.StockIndicators'
          for attempt in range(40):
              run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/39703203214']))
              assert run['head_sha']=='37c8bd54b6a9861338bd7b2f21dd65cab02f9326'
              jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/39703203214/jobs?per_page=100']))
              build=[j for j in jobs['jobs'] if j['name']=='build']
              assert len(build)<=1
              if build and build[0]['status']=='completed':
                  assert build[0]['conclusion']=='success',build[0]['conclusion']
                  Path('binary-build-provenance.json').write_text(json.dumps({'run':run,'build':build[0]},indent=2))
                  break
              time.sleep(30)
          else: raise TimeoutError('Source-matched CI build is not ready')
          PY
      - uses: actions/download-artifact@v8
        with:
          name: competitor-binaries
          path: binaries
          run-id: 39703203214
          github-token: ${{ github.token }}
      - name: Measure both libraries and both sizes on the dedicated runner
        run: >-
          dotnet binaries/OoplesFinance.StockIndicators.CompetitorBenchmarks.dll
          --filter '*LibraryPairBenchmarks.Ooples*' '*LibraryPairBenchmarks.Competitor*'
          --warmupCount 10 --iterationCount 10 --exporters json csv --artifacts performance
      - name: Verify complete samples and retain uncertainty
        run: python scripts/verify-sma-hosted-timing.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: certified-sma-competitor-timing
          path: |
            performance/
            binary-build-provenance.json
          retention-days: 30
