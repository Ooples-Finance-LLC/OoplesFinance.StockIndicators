name: Fibonacci builder and native measurement
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fibonacci-builder-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify qualified binary source and unchanged Fibonacci implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/measure-fibonacci-builder.py verify
      - uses: actions/download-artifact@v8
        with:
          name: competitor-binaries
          path: binaries
          run-id: 39719116665
          github-token: ${{ github.token }}
      - name: Measure both builder modes and both native arms
        run: python scripts/measure-fibonacci-builder.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fibonacci-builder-measurement
          path: measurement/
          retention-days: 30
