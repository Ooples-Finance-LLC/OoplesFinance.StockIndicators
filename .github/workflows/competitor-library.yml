name: Controlled compensated EMA factoring comparison
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Fully qualified candidate commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: compensated-factored-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify pinned sources and existing qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/compare-compensated-factored.py verify
      - uses: actions/download-artifact@v8
        with:
          name: competitor-binaries
          path: old-binaries
          run-id: 39719116665
          github-token: ${{ github.token }}
      - name: Build candidate production DLL for hosted runtime
        run: dotnet build candidate/src/OoplesFinance.StockIndicators.csproj -c Release -f net10.0 -p:GeneratePackageOnBuild=false -m:1
      - name: Measure old new new old with identical harness
        run: python scripts/compare-compensated-factored.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compensated-factored-control
          path: control/
          retention-days: 30
