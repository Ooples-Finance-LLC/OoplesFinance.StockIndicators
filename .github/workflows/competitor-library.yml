name: CPU builder batch eleven measurements
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cpu-builder-batch11-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        fixture: [SharedDispersionBenchmarks, SharedQuarticDynamicBenchmarks, SharedTrendReversalBenchmarks]
    env:
      BUILDER_FIXTURE: ${{ matrix.fixture }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify qualified binary source and unchanged mapped implementations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/measure-cpu-builder-batch11.py verify
      - uses: actions/download-artifact@v8
        with:
          name: competitor-binaries
          path: binaries
          run-id: 39719116665
          github-token: ${{ github.token }}
      - name: Measure both builder modes and both native arms
        run: python scripts/measure-cpu-builder-batch11.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: builder-${{ matrix.fixture }}
          path: measurement/
          retention-days: 30
