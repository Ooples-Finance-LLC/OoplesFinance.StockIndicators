name: Controlled SAR array comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sar-array-control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pair: [TaLib.Functions.Sar, TaLib.Functions.SarExt]
    env:
      COMPARISON_PAIR: ${{ matrix.pair }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify both immutable binary runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/compare-sar-array.py verify
      - uses: actions/download-artifact@v8
        with:
          name: competitor-binaries
          path: old-binaries
          run-id: 39719116665
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: competitor-binaries
          path: new-binaries
          run-id: 39721035437
          github-token: ${{ github.token }}
      - name: Measure old new new old on the same runner
        run: python scripts/compare-sar-array.py measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sar-array-control-${{ matrix.pair }}
          path: control/
          retention-days: 30
