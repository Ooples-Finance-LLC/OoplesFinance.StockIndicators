name: Release Please

# Batched, reviewable releases.
#
# How it works:
#   1. Every push to master, release-please accumulates the conventional-commit changes since the
#      last release into a rolling "Release PR" (version bump + CHANGELOG). NO release is cut yet -
#      merges just keep updating that one PR, so a burst of merged PRs bundles into a single version.
#   2. When a maintainer merges the Release PR, release-please creates the git tag (v<version>) and
#      the GitHub release. Only then does the `publish` job run: it builds, packs, pushes to NuGet
#      and attaches the .nupkg to the release.
#
# Merging the Release PR is the explicit, human approval gate - nothing publishes without it.
#
# Publishing uses NuGet trusted publishing (OIDC): no long-lived API key is stored in this
# repository at all. The publish job mints a GitHub OIDC token and NuGet/login exchanges it for
# a key valid for minutes, which nuget.org grants only because a trusted-publishing policy on
# the package names this repository and this workflow file.
#
# Seeding note: the manifest starts at 1.0.53, which is the newest version actually on nuget.org.
# The repository's tags stop at v1.0.49 and the csproj said 1.1.0, so neither of those was a safe
# starting point. `bootstrap-sha` in release-please-config.json pins the first Release PR to only
# describe work merged after release automation landed, instead of replaying the whole history.

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pull-requests: write

# Serialize (never cancel): a release cut / PR update must finish. Runs are cheap when they only
# update the Release PR, and must be atomic when they actually publish.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain Release PR / cut release
    runs-on: ubuntu-latest
    # A job-level permissions block OVERRIDES the workflow default, so contents/pull-requests are
    # re-declared here; issues:write is scoped to this job only, following least privilege.
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please creates/applies the `autorelease:` labels via the Issues API
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PAT (not GITHUB_TOKEN) so the Release PR and the tag it creates can trigger the normal
          # CI checks; GITHUB_TOKEN-authored events do not re-trigger workflows. Falls back to
          # GITHUB_TOKEN if the PAT is not configured (the PR still opens, CI just will not auto-run).
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  critical-correctness:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/critical-correctness.yml
    permissions:
      contents: read
    with:
      source-ref: ${{ needs.release-please.outputs.tag_name }}

  build-package:
    name: Build and pack release candidate
    runs-on: windows-latest # net461 needs the .NET Framework reference assemblies
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore and build
        run: |
          dotnet restore src/OoplesFinance.StockIndicators.csproj
          dotnet build src/OoplesFinance.StockIndicators.csproj -c Release --no-restore

      - name: Pack NuGet
        run: >
          dotnet pack src/OoplesFinance.StockIndicators.csproj -c Release -o out --no-build
          /p:PackageVersion=${{ needs.release-please.outputs.version }}

      - name: Require regression and independent numerical tests
        run: dotnet test tests/OoplesFinance.StockIndicators.Tests.Unit.csproj -c Release -f net10.0 --logger trx --results-directory release-test-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-test-results
          path: release-test-results
          if-no-files-found: error

      - name: Verify the package ships every target framework
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # The expected list is read from the csproj rather than hardcoded. Hardcoding it couples
          # this workflow to whatever TargetFrameworks happened to say when it was written, so a
          # legitimate change to the target list would fail verification AFTER release-please had
          # already created the tag and the GitHub release - leaving a release with no package.
          [xml]$proj = Get-Content 'src/OoplesFinance.StockIndicators.csproj'
          $raw = @($proj.Project.PropertyGroup.TargetFrameworks) +
                 @($proj.Project.PropertyGroup.TargetFramework) |
                 Where-Object { $_ -and $_.ToString().Trim() } | Select-Object -First 1
          $tfms = @($raw -split ';' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if (-not $tfms) { Write-Error 'Could not read TargetFrameworks from the csproj'; exit 1 }
          Write-Host "Project targets: $($tfms -join ', ')"

          $pkgs = Get-ChildItem out/*.nupkg
          if (-not $pkgs) { Write-Error 'No .nupkg produced in out/'; exit 1 }
          foreach ($pkg in $pkgs) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
            try   { $entries = $zip.Entries.FullName }
            finally { $zip.Dispose() }
            # Catches the pack-time failure this guards against: a target the project still claims
            # but that never made it into the package, which publishes cleanly and only surfaces
            # when a consumer on that framework tries to restore it.
            foreach ($tfm in $tfms) {
              if (-not ($entries | Where-Object { $_ -match "^lib/$([regex]::Escape($tfm))/.+\.dll$" })) {
                Write-Error "$($pkg.Name) is missing lib/$tfm"; exit 1
              }
              Write-Host "Found lib/$tfm in $($pkg.Name)"
            }
          }

      - name: Upload the immutable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: out/*.nupkg
          if-no-files-found: error

  verify-package:
    name: Verify package (${{ matrix.os }}, ${{ matrix.framework }})
    needs: [release-please, build-package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net461
          - os: windows-latest
            framework: net8.0
          - os: windows-latest
            framework: net10.0
          - os: ubuntu-latest
            framework: net8.0
          - os: ubuntu-latest
            framework: net10.0
          - os: macos-latest
            framework: net8.0
          - os: macos-latest
            framework: net10.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: out
      - name: Test the packaged DLL and verify its identity
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem out/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected one release package.' }
          ./tools/Verify-CorrectnessPackage.ps1 -PackagePath $packages[0].FullName -TargetFramework '${{ matrix.framework }}' -EvidencePath correctness-evidence.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-evidence-${{ matrix.os }}-${{ matrix.framework }}
          path: correctness-evidence.xml
          if-no-files-found: error

  publish:
    name: Publish verified NuGet package
    needs: [release-please, build-package, verify-package, critical-correctness]
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: out
      - uses: actions/download-artifact@v8
        with:
          pattern: package-evidence-*
          path: evidence
      - name: Require evidence for this exact package on every matrix entry
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem out/*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected one release package.' }
          $hash = (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash
          $reports = @(Get-ChildItem evidence -Recurse -Filter correctness-evidence.xml)
          if ($reports.Count -ne 7) { throw 'Missing platform evidence.' }
          $expected = @('windows-latest-net461', 'windows-latest-net8.0', 'windows-latest-net10.0',
            'ubuntu-latest-net8.0', 'ubuntu-latest-net10.0', 'macos-latest-net8.0', 'macos-latest-net10.0')
          foreach ($entry in $expected) {
            if (-not (Test-Path -LiteralPath "evidence/package-evidence-$entry/correctness-evidence.xml")) {
              throw "Missing evidence for $entry."
            }
          }
          foreach ($report in $reports) {
            [xml]$proof = Get-Content $report.FullName -Raw
            if ($proof.correctnessEvidence.scope -ne 'all-discovered-configurations') { throw 'Filtered evidence cannot authorize publication.' }
            if ($report.Directory.Name -notlike "*-$($proof.correctnessEvidence.targetFramework)") { throw 'Framework evidence identity mismatch.' }
            if ($proof.correctnessEvidence.packageSha256 -ne $hash) { throw 'Package identity changed after verification.' }
            $cases = @($proof.correctnessEvidence.case)
            if ($cases.Count -eq 0 -or @($cases | Where-Object { $_.passed -ne 'True' }).Count -gt 0) { throw 'Incomplete or failing correctness evidence.' }
            ./tools/Assert-CorrectnessFormulaEvidence.ps1 -Evidence $proof
            ./tools/Assert-CorrectnessNumericalEvidence.ps1 -Evidence $proof
          }

      - name: Authenticate to NuGet via trusted publishing
        id: nuget-login
        # Trusted publishing: there is no long-lived NUGET_API_KEY secret to leak or rotate. The
        # action swaps this workflow's GitHub OIDC token for a key that lives minutes, and
        # nuget.org only honours it because a trusted-publishing policy on the package names this
        # exact repository and workflow file.
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER || 'ooples' }}

      - name: Push to NuGet
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in out/*.nupkg; do
            echo "Publishing $pkg"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Attach the .nupkg to the GitHub release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" out/*.nupkg --clobber
