name: Commit Message Lint

# Lints every commit in a pull request against commitlint.config.mjs.
#
# Why it matters here: release-please builds the version bump and the CHANGELOG from commit
# messages, so a commit that does not parse is invisible to the release, and a mistyped type
# silently changes the version bump.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Lint commit messages
    # Skipped for generated commits, by AUTHOR rather than by message. Dependabot composes its
    # own subject and always capitalises "Bump", which config-conventional's subject-case rule
    # rejects, and no Dependabot setting lowercases it. Exempting it through commitlint's
    # `ignores` would have keyed on the message text alone, so any human could write
    # "deps: Bump ..." and skip every rule; github.event.pull_request.user.login is set by
    # GitHub and cannot be spoofed from the branch.
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--')
          && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint needs the full base..head range, which a shallow clone does not contain.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned commitlint
        run: |
          npm install --prefix "$RUNNER_TEMP/commitlint" --no-package-lock --ignore-scripts --no-audit --no-fund @commitlint/cli@19.8.1 @commitlint/config-conventional@19.8.1
          cp commitlint.config.mjs "$RUNNER_TEMP/commitlint/commitlint.config.mjs"

      - name: Verify full-range lint behavior
        run: >-
          python3 .github/scripts/test_commitlint_range.py
          --cli "$RUNNER_TEMP/commitlint/node_modules/@commitlint/cli/cli.js"
          --config "$RUNNER_TEMP/commitlint/commitlint.config.mjs"

      - name: Lint commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$PR_BASE" "$PR_HEAD"
          echo "Linting $(git rev-list --count "$PR_BASE..$PR_HEAD") commits in the complete PR range"
          node "$RUNNER_TEMP/commitlint/node_modules/@commitlint/cli/cli.js" --config "$RUNNER_TEMP/commitlint/commitlint.config.mjs" --from "$PR_BASE" --to "$PR_HEAD" --verbose
