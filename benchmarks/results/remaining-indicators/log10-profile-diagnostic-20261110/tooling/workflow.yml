name: Log10 existing-binary diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: log10-profile-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [batch, builder]
    env:
      HOSTED_TIMING_PLAN: benchmarks/plans/hosted-log-parallel-minimum-20261109.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            scripts
            benchmarks/plans
            .github
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install psutil==7.1.0
      - run: dotnet tool install --tool-path trace-tools dotnet-trace --version 10.0.750501
      - shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/trace-tools"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: '13727772374'
          path: hosted-inputs
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Ooples-Finance-LLC/OoplesFinance.StockIndicators
          run-id: '42734662811'
      - run: python -m unittest discover -s scripts -p test_log10_profile_diagnostic.py
      - run: python scripts/run-log10-profile-diagnostic.py --profile ${{ matrix.profile }} --inputs hosted-inputs --out log10-${{ matrix.profile }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: log10-profile-${{ matrix.profile }}
          path: log10-${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 14
